# Render Blueprint: Render → New → Blueprint → shu repozitoriy.
# Bitta xizmat: bot + Mini App + admin panel + eslatmalar (Dockerfile bo'yicha).
# Ma'lumotlar bazasi — Neon (tekin PostgreSQL), manzili DATABASE_URL ga yoziladi.
# Batafsil: docs/render-joylash.md
services:
  - type: web
    name: tarix
    runtime: docker
    plan: free
    region: frankfurt          # O'zbekistonga eng yaqin
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      # Maxfiy qiymatlar: Render ularni so'raydi, GitHub'ga yozilmaydi
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: CHANNEL_ID
        sync: false
      # Oddiy sozlamalar
      - key: TIMEZONE
        value: Asia/Tashkent
      - key: REMINDER_TIME
        value: "19:00"
      - key: HISTORY_POST_TIME
        value: "09:00"
      - key: DAILY_QUESTION_COUNT
        value: "10"
      - key: QUIZ_LENGTH
        value: "10"
      - key: DEV_TELEGRAM_ID
        value: "0"             # serverda HECH QACHON yoqilmaydi
      # WEBAPP_URL shart emas: Render domeni (RENDER_EXTERNAL_URL) avtomatik olinadi
